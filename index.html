<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B2028">
<title>PHONEPAD – Prototype de manette</title>

<!--
  PHONEPAD – étape 1 : interface + détection des commandes dans le navigateur.
  Un seul fichier, aucune bibliothèque, aucune connexion réseau.
  Rien n'est envoyé au PC : chaque commande est seulement détectée et affichée.

  Pour l'étape suivante, écoutez l'événement "phonepad:input" (voir la fin du script).
-->

<style>
  *{box-sizing:border-box;margin:0}

  :root{
    /* Unité de base : 1 u = 1 % de la plus petite dimension utile de l'écran en paysage */
    --u:min(1vh,.5vw);

    --ink:#E8EEF7;
    --ink-dim:#A9B6CA;
    --shell-hi:#3C4758;
    --shell:#313B4A;
    --shell-lo:#252D3A;
    --well:#1D242E;
    --key-hi:#64738A;
    --key-lo:#4C596C;
    --lcd-ink:#233221;
    --focus:#8FD3FF;

    --stick:calc(50*var(--u));
    --thumb:calc(22*var(--u));
    --face:calc(17*var(--u));
  }
  @supports (height:1dvh){:root{--u:min(1dvh,.5vw)}}

  [hidden]{display:none!important}

  html,body{
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:#1B2028;
    color:var(--ink);
    font-family:"Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }

  button{
    font:inherit;color:inherit;border:0;padding:0;background:none;
    cursor:pointer;touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }
  :focus-visible{outline:calc(.5*var(--u)) solid var(--focus);outline-offset:calc(.4*var(--u))}

  /* ---------- Coque de la manette ---------- */
  .pad{
    position:fixed;
    inset:
      max(calc(1*var(--u)),env(safe-area-inset-top))
      max(calc(1*var(--u)),env(safe-area-inset-right))
      max(calc(1*var(--u)),env(safe-area-inset-bottom))
      max(calc(1*var(--u)),env(safe-area-inset-left));
    display:grid;
    grid-template-columns:1fr calc(54*var(--u)) 1fr;
    grid-template-rows:auto 1fr;
    column-gap:calc(2*var(--u));
    padding:calc(3*var(--u)) calc(4*var(--u));
    border-radius:calc(9*var(--u));
    background:
      radial-gradient(120% 70% at 50% -25%,rgba(255,255,255,.13),transparent 60%),
      radial-gradient(38% 70% at 0% 100%,rgba(0,0,0,.28),transparent 70%),
      radial-gradient(38% 70% at 100% 100%,rgba(0,0,0,.28),transparent 70%),
      linear-gradient(180deg,var(--shell-hi),var(--shell) 45%,var(--shell-lo));
    box-shadow:
      inset 0 calc(.35*var(--u)) 0 rgba(255,255,255,.16),
      inset 0 calc(-.5*var(--u)) 0 rgba(0,0,0,.25),
      0 calc(2*var(--u)) calc(6*var(--u)) rgba(0,0,0,.5);
  }

  /* ---------- Touches de base ---------- */
  .key{
    display:grid;place-items:center;
    font-weight:700;
    font-size:max(10px,calc(3.4*var(--u)));
    color:var(--ink);
    text-shadow:0 1px 0 rgba(0,0,0,.35);
    background:linear-gradient(180deg,var(--key-hi),var(--key-lo));
    box-shadow:
      0 calc(.7*var(--u)) 0 rgba(0,0,0,.38),
      inset 0 calc(.3*var(--u)) 0 rgba(255,255,255,.22);
    transition:transform .14s ease-out,box-shadow .14s ease-out,filter .14s ease-out;
  }
  /* L'appui est instantané : aucune transition quand la touche est enfoncée */
  .key.is-down{
    transition:none;
    transform:translateY(calc(.6*var(--u))) scale(.97);
    filter:brightness(1.22);
    box-shadow:
      0 0 0 rgba(0,0,0,.38),
      inset 0 calc(.5*var(--u)) calc(1*var(--u)) rgba(0,0,0,.35);
  }

  /* ---------- Gâchettes L1/L2 R1/R2 ---------- */
  .shoulders{display:flex;gap:calc(2*var(--u));justify-content:center;align-items:flex-start;grid-row:1}
  .shoulders.left{grid-column:1}
  .shoulders.right{grid-column:3}
  .shoulder{
    width:calc(21*var(--u));height:calc(9*var(--u));
    border-radius:calc(4.5*var(--u)) calc(4.5*var(--u)) calc(1.8*var(--u)) calc(1.8*var(--u));
  }
  .shoulder.trigger{background:linear-gradient(180deg,#59687E,#44505F)}

  /* ---------- Joystick ---------- */
  .stick-area{grid-column:1;grid-row:2;display:grid;place-items:center}
  .stick{
    position:relative;
    width:var(--stick);height:var(--stick);
    border-radius:50%;
    touch-action:none;
    background:
      linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.06)) center/100% 1px no-repeat,
      linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.06)) center/1px 100% no-repeat,
      radial-gradient(circle,#232B36 0 56%,#303A48 57% 59%,var(--well) 60%);
    box-shadow:
      inset 0 calc(1*var(--u)) calc(2.2*var(--u)) rgba(0,0,0,.6),
      0 calc(.3*var(--u)) 0 rgba(255,255,255,.1);
  }
  .thumb{
    position:absolute;left:50%;top:50%;
    width:var(--thumb);height:var(--thumb);
    margin:calc(var(--thumb)/-2) 0 0 calc(var(--thumb)/-2);
    border-radius:50%;
    background:radial-gradient(circle at 38% 30%,#93A1B7,#5D6C83 55%,#434F63);
    box-shadow:
      0 calc(1*var(--u)) calc(1.6*var(--u)) rgba(0,0,0,.5),
      inset 0 calc(.3*var(--u)) 0 rgba(255,255,255,.35);
    /* retour au centre en douceur au relâchement */
    transition:transform .16s cubic-bezier(.2,.9,.3,1.25);
    pointer-events:none;
  }
  .thumb::after{
    content:"";position:absolute;inset:24%;border-radius:50%;
    background:radial-gradient(circle at 50% 40%,#3A4659,#505E74);
    box-shadow:inset 0 calc(.5*var(--u)) calc(.9*var(--u)) rgba(0,0,0,.5);
  }
  .thumb.dragging{transition:none;filter:brightness(1.12)}

  /* ---------- Boutons A B X Y ---------- */
  .face-area{grid-column:3;grid-row:2;display:grid;place-items:center}
  .faces{
    display:grid;
    grid-template:repeat(3,var(--face)) / repeat(3,var(--face));
    gap:calc(1.2*var(--u));
    padding:calc(3*var(--u));
    border-radius:50%;
    background:radial-gradient(circle,#28313D 0 60%,#232B36 61%);
    box-shadow:
      inset 0 calc(.8*var(--u)) calc(1.8*var(--u)) rgba(0,0,0,.45),
      0 calc(.3*var(--u)) 0 rgba(255,255,255,.08);
  }
  .face{
    width:var(--face);height:var(--face);
    border-radius:50%;
    font-size:calc(6.4*var(--u));font-weight:800;
    color:rgba(20,32,43,.82);text-shadow:none;
    background:
      radial-gradient(circle at 35% 28%,rgba(255,255,255,.42),rgba(255,255,255,0) 48%),
      var(--c);
    box-shadow:
      0 calc(.8*var(--u)) 0 rgba(0,0,0,.4),
      inset 0 calc(-.9*var(--u)) calc(1.2*var(--u)) rgba(0,0,0,.22);
  }
  .face.is-down{
    box-shadow:
      0 0 0 rgba(0,0,0,.4),
      inset 0 calc(.5*var(--u)) calc(1*var(--u)) rgba(0,0,0,.3),
      0 0 calc(3.2*var(--u)) var(--glow);
  }
  .face[data-btn=Y]{grid-area:1/2;--c:#EDBE45;--glow:rgba(237,190,69,.85)}
  .face[data-btn=X]{grid-area:2/1;--c:#4B86E8;--glow:rgba(75,134,232,.85)}
  .face[data-btn=B]{grid-area:2/3;--c:#E0594F;--glow:rgba(224,89,79,.85)}
  .face[data-btn=A]{grid-area:3/2;--c:#4FB286;--glow:rgba(79,178,134,.85)}

  /* ---------- Colonne centrale ---------- */
  .center{
    grid-column:2;grid-row:1 / 3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:calc(2.6*var(--u));
    min-width:0;
  }
  .brand-row{display:flex;align-items:center;gap:calc(2.4*var(--u))}
  .brand h1{font-size:calc(5.2*var(--u));font-weight:800;letter-spacing:.1em;line-height:1}
  .brand p{margin-top:calc(.9*var(--u));font-size:max(10px,calc(2.7*var(--u)));color:var(--ink-dim)}
  .icon{
    flex:none;
    width:calc(7*var(--u));height:calc(7*var(--u));border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(180deg,var(--key-hi),var(--key-lo));
    box-shadow:0 calc(.5*var(--u)) 0 rgba(0,0,0,.38),inset 0 calc(.3*var(--u)) 0 rgba(255,255,255,.22);
  }
  .icon svg{width:55%;height:55%;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .lcd{
    width:100%;height:calc(40*var(--u));
    padding:calc(2.2*var(--u)) calc(2.6*var(--u));
    border-radius:calc(2.4*var(--u));
    display:flex;flex-direction:column;gap:calc(.3*var(--u));
    overflow:hidden;
    color:var(--lcd-ink);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    font-size:max(10px,calc(3.1*var(--u)));line-height:1.45;
    background:
      repeating-linear-gradient(0deg,rgba(35,50,33,.07) 0 1px,transparent 1px 3px),
      linear-gradient(180deg,#C3CFB0,#B3C09F);
    box-shadow:
      inset 0 calc(.6*var(--u)) calc(1.4*var(--u)) rgba(0,0,0,.35),
      0 calc(.3*var(--u)) 0 rgba(255,255,255,.12);
  }
  .lcd .row{display:flex;justify-content:space-between;gap:calc(1.4*var(--u));min-width:0}
  .lcd .k{opacity:.7;flex:none}
  .lcd .v{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .log{
    list-style:none;margin-top:calc(.8*var(--u));padding-top:calc(.8*var(--u));
    border-top:1px dashed rgba(35,50,33,.5);
    display:flex;flex-direction:column;gap:0;
  }
  .log li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.6}
  .log li:first-child{opacity:1;font-weight:700}
  .log li::before{content:"› "}

  .meta{display:flex;gap:calc(3*var(--u))}
  .meta .key{
    width:calc(17*var(--u));height:calc(7*var(--u));
    border-radius:calc(3.5*var(--u));
    font-size:max(10px,calc(3*var(--u)));
  }

  /* ---------- Message en mode portrait ---------- */
  .rotate{
    display:none;position:fixed;inset:0;
    place-content:center;justify-items:center;gap:16px;
    padding:24px;text-align:center;font-size:18px;line-height:1.4;
    color:var(--ink);
  }
  .rotate svg{width:64px;height:64px;stroke:var(--ink-dim);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  @media (orientation:portrait){
    .pad{display:none}
    .rotate{display:grid}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>

<body>

<main class="pad" id="pad">

  <!-- Gâchettes gauche -->
  <div class="shoulders left">
    <button class="key shoulder trigger" data-btn="L2" type="button" aria-label="L2">L2</button>
    <button class="key shoulder" data-btn="L1" type="button" aria-label="L1">L1</button>
  </div>

  <!-- Centre : nom, écran de contrôle, Select / Start -->
  <section class="center">
    <div class="brand-row">
      <div class="brand">
        <h1>PHONEPAD</h1>
        <p>Mode test, non relié au PC</p>
      </div>
      <button class="icon" id="fs" type="button" aria-label="Plein écran" title="Plein écran" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <div class="lcd" aria-label="Commandes détectées">
      <div class="row"><span class="k">Boutons</span><span class="v" id="o-btn">aucun</span></div>
      <div class="row"><span class="k">Stick</span><span class="v" id="o-axes">x +0.00 y +0.00</span></div>
      <div class="row"><span class="k">Direction</span><span class="v" id="o-dir">centre</span></div>
      <ol class="log" id="o-log"></ol>
    </div>

    <div class="meta">
      <button class="key" data-btn="Select" type="button">Select</button>
      <button class="key" data-btn="Start" type="button">Start</button>
    </div>
  </section>

  <!-- Gâchettes droite -->
  <div class="shoulders right">
    <button class="key shoulder" data-btn="R1" type="button" aria-label="R1">R1</button>
    <button class="key shoulder trigger" data-btn="R2" type="button" aria-label="R2">R2</button>
  </div>

  <!-- Joystick gauche -->
  <div class="stick-area">
    <div class="stick" id="stick" role="group" aria-label="Joystick gauche">
      <div class="thumb" id="thumb"></div>
    </div>
  </div>

  <!-- Boutons A B X Y -->
  <div class="face-area">
    <div class="faces">
      <button class="key face" data-btn="Y" type="button" aria-label="Y">Y</button>
      <button class="key face" data-btn="X" type="button" aria-label="X">X</button>
      <button class="key face" data-btn="B" type="button" aria-label="B">B</button>
      <button class="key face" data-btn="A" type="button" aria-label="A">A</button>
    </div>
  </div>

</main>

<div class="rotate" role="status">
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M3 12a9 9 0 0 1 3-6.7M21 12a9 9 0 0 1-3 6.7"/></svg>
  <p>Tournez votre téléphone en mode paysage pour utiliser la manette.</p>
</div>

<script>
(() => {
  "use strict";

  const $ = (sel) => document.querySelector(sel);

  /* État courant de la manette */
  const state = {
    buttons: new Set(),     // boutons actuellement enfoncés
    axes: { x: 0, y: 0 }    // joystick : -1 à +1 (y négatif = vers le haut, comme l'API Gamepad)
  };

  /* ---------- Écran de contrôle ---------- */
  const out = { btn: $("#o-btn"), axes: $("#o-axes"), dir: $("#o-dir"), log: $("#o-log") };
  const logLines = ["En attente d’une commande"];
  let queued = false;

  const fmt = (v) => (v < 0 ? "-" : "+") + Math.abs(v).toFixed(2);
  const DIRS = ["droite", "haut-droite", "haut", "haut-gauche", "gauche", "bas-gauche", "bas", "bas-droite"];

  function direction(a) {
    if (Math.hypot(a.x, a.y) < 0.35) return "centre";
    const deg = Math.atan2(-a.y, a.x) * 180 / Math.PI;
    return DIRS[(Math.round(deg / 45) + 8) % 8];
  }

  function render() {
    out.btn.textContent = state.buttons.size ? [...state.buttons].join(" + ") : "aucun";
    out.axes.textContent = "x " + fmt(state.axes.x) + " y " + fmt(state.axes.y);
    out.dir.textContent = direction(state.axes);
    out.log.replaceChildren(...logLines.map((t) => {
      const li = document.createElement("li");
      li.textContent = t;
      return li;
    }));
  }

  function queueRender() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; render(); });
  }

  function pushLog(text) {
    logLines.unshift(text);
    if (logLines.length > 3) logLines.pop();
  }

  function buzz() {
    try { if (navigator.vibrate) navigator.vibrate(8); } catch (_) {}
  }

  /* Point de sortie unique de toutes les commandes détectées */
  function emit(kind, name, value) {
    window.dispatchEvent(new CustomEvent("phonepad:input", {
      detail: {
        kind,                              // "button" ou "stick"
        name,                              // "A", "L1", "left"…
        value,                             // true/false pour un bouton, {x,y} pour le stick
        buttons: [...state.buttons],
        axes: { x: state.axes.x, y: state.axes.y }
      }
    }));
    queueRender();
  }

  /* ---------- Boutons ---------- */
  document.querySelectorAll("[data-btn]").forEach((el) => {
    const name = el.dataset.btn;
    let holder = null;   // pointeur (ou "key") qui tient actuellement le bouton

    function press(id) {
      if (holder !== null) return;
      holder = id;
      el.classList.add("is-down");
      state.buttons.add(name);
      buzz();
      pushLog(name + " pressé");
      emit("button", name, true);
    }

    function release(id) {
      if (holder === null || holder !== id) return;
      holder = null;
      el.classList.remove("is-down");
      state.buttons.delete(name);
      pushLog(name + " relâché");
      emit("button", name, false);
    }

    el.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      press(e.pointerId);
    });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach((type) => {
      el.addEventListener(type, (e) => release(e.pointerId));
    });

    /* Accessibilité clavier (Espace / Entrée) */
    el.addEventListener("keydown", (e) => {
      if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); press("key"); }
    });
    el.addEventListener("keyup", (e) => {
      if (e.key === " " || e.key === "Enter") release("key");
    });
    el.addEventListener("blur", () => release("key"));
  });

  /* ---------- Joystick ---------- */
  const stick = $("#stick");
  const thumb = $("#thumb");
  let stickId = null, cx = 0, cy = 0, travel = 1;

  function measure() {
    const r = stick.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top + r.height / 2;
    travel = (r.width - thumb.offsetWidth) / 2;
  }

  function moveTo(e) {
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > travel) { dx *= travel / d; dy *= travel / d; }   // limite circulaire : toutes les directions
    thumb.style.transform = "translate(" + dx + "px," + dy + "px)";

    let x = dx / travel, y = dy / travel;
    if (Math.hypot(x, y) < 0.08) { x = 0; y = 0; }             // petite zone morte au centre
    state.axes.x = Math.round(x * 100) / 100 + 0;
    state.axes.y = Math.round(y * 100) / 100 + 0;
    emit("stick", "left", { x: state.axes.x, y: state.axes.y });
  }

  function endStick(e) {
    if (stickId === null || e.pointerId !== stickId) return;
    stickId = null;
    thumb.classList.remove("dragging");
    thumb.style.transform = "";                                // retour au centre
    state.axes.x = 0;
    state.axes.y = 0;
    pushLog("Stick relâché");
    emit("stick", "left", { x: 0, y: 0 });
  }

  stick.addEventListener("pointerdown", (e) => {
    if (stickId !== null) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    stickId = e.pointerId;
    try { stick.setPointerCapture(e.pointerId); } catch (_) {}
    measure();
    thumb.classList.add("dragging");
    buzz();
    pushLog("Stick saisi");
    moveTo(e);
  });
  stick.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) moveTo(e); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((type) => stick.addEventListener(type, endStick));

  /* ---------- Plein écran (utile sur Android) ---------- */
  const fs = $("#fs");
  if (document.documentElement.requestFullscreen) {
    fs.hidden = false;
    fs.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
          try { await screen.orientation.lock("landscape"); } catch (_) {}
        }
      } catch (_) {}
    });
  }

  /* ---------- Confort tactile ---------- */
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("gesturestart", (e) => e.preventDefault());

  render();

  /* ---------- Étape suivante ----------
     Chaque commande passe par l'événement "phonepad:input".
     C'est ici que viendra plus tard l'envoi vers le PC. Pour l'instant : console seulement.

     window.addEventListener("phonepad:input", (e) => console.log(e.detail));
  */
  window.PHONEPAD = { getState: () => ({ buttons: [...state.buttons], axes: { ...state.axes } }) };
})();
</script>
</body>
</html>
