<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B2028">
<title>PHONEPAD – Prototype de manette</title>

<!--
  PHONEPAD – étape 1 : interface + détection des commandes dans le navigateur.
  Un seul fichier, aucune bibliothèque.
  Les commandes sont envoyées au récepteur Python local (POST /input), une requête à la fois.

  Pour l'étape suivante, écoutez l'événement "phonepad:input" (voir la fin du script).
-->

<style>
  *{box-sizing:border-box;margin:0}

  :root{
    /* Unité de base : 1 u = 1 % de la plus petite dimension utile de l'écran en paysage */
    --u:min(1vh,.5vw);

    --ink:#E8EEF7;
    --ink-dim:#A9B6CA;
    --shell-hi:#3C4758;
    --shell:#313B4A;
    --shell-lo:#252D3A;
    --well:#1D242E;
    --key-hi:#64738A;
    --key-lo:#4C596C;
    --lcd-ink:#233221;
    --focus:#8FD3FF;

    --stick:calc(50*var(--u));
    --thumb:calc(22*var(--u));
    --face:calc(17*var(--u));
  }
  @supports (height:1dvh){:root{--u:min(1dvh,.5vw)}}

  [hidden]{display:none!important}

  html,body{
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:#1B2028;
    color:var(--ink);
    font-family:"Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }

  button{
    font:inherit;color:inherit;border:0;padding:0;background:none;
    cursor:pointer;touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }
  :focus-visible{outline:calc(.5*var(--u)) solid var(--focus);outline-offset:calc(.4*var(--u))}

  /* ---------- Coque de la manette ---------- */
  .pad{
    position:fixed;
    inset:
      max(calc(1*var(--u)),env(safe-area-inset-top))
      max(calc(1*var(--u)),env(safe-area-inset-right))
      max(calc(1*var(--u)),env(safe-area-inset-bottom))
      max(calc(1*var(--u)),env(safe-area-inset-left));
    display:grid;
    grid-template-columns:1fr calc(54*var(--u)) 1fr;
    grid-template-rows:auto 1fr;
    column-gap:calc(2*var(--u));
    padding:calc(3*var(--u)) calc(4*var(--u));
    border-radius:calc(9*var(--u));
    background:
      radial-gradient(120% 70% at 50% -25%,rgba(255,255,255,.13),transparent 60%),
      radial-gradient(38% 70% at 0% 100%,rgba(0,0,0,.28),transparent 70%),
      radial-gradient(38% 70% at 100% 100%,rgba(0,0,0,.28),transparent 70%),
      linear-gradient(180deg,var(--shell-hi),var(--shell) 45%,var(--shell-lo));
    box-shadow:
      inset 0 calc(.35*var(--u)) 0 rgba(255,255,255,.16),
      inset 0 calc(-.5*var(--u)) 0 rgba(0,0,0,.25),
      0 calc(2*var(--u)) calc(6*var(--u)) rgba(0,0,0,.5);
  }

  /* ---------- Touches de base ---------- */
  .key{
    display:grid;place-items:center;
    font-weight:700;
    font-size:max(10px,calc(3.4*var(--u)));
    color:var(--ink);
    text-shadow:0 1px 0 rgba(0,0,0,.35);
    background:linear-gradient(180deg,var(--key-hi),var(--key-lo));
    box-shadow:
      0 calc(.7*var(--u)) 0 rgba(0,0,0,.38),
      inset 0 calc(.3*var(--u)) 0 rgba(255,255,255,.22);
    transition:transform .14s ease-out,box-shadow .14s ease-out,filter .14s ease-out;
  }
  /* L'appui est instantané : aucune transition quand la touche est enfoncée */
  .key.is-down{
    transition:none;
    transform:translateY(calc(.6*var(--u))) scale(.97);
    filter:brightness(1.22);
    box-shadow:
      0 0 0 rgba(0,0,0,.38),
      inset 0 calc(.5*var(--u)) calc(1*var(--u)) rgba(0,0,0,.35);
  }

  /* ---------- Gâchettes L1/L2 R1/R2 ---------- */
  .shoulders{display:flex;gap:calc(2*var(--u));justify-content:center;align-items:flex-start;grid-row:1}
  .shoulders.left{grid-column:1}
  .shoulders.right{grid-column:3}
  .shoulder{
    width:calc(21*var(--u));height:calc(9*var(--u));
    border-radius:calc(4.5*var(--u)) calc(4.5*var(--u)) calc(1.8*var(--u)) calc(1.8*var(--u));
  }
  .shoulder.trigger{background:linear-gradient(180deg,#59687E,#44505F)}

  /* ---------- Joystick ---------- */
  .stick-area{grid-column:1;grid-row:2;display:grid;place-items:center;position:relative}
  .stick-area > .dpad,.stick-area > .stick{grid-area:1/1}
  .stick{
    position:relative;
    width:var(--stick);height:var(--stick);
    border-radius:50%;
    touch-action:none;
    background:
      linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.06)) center/100% 1px no-repeat,
      linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.06)) center/1px 100% no-repeat,
      radial-gradient(circle,#232B36 0 56%,#303A48 57% 59%,var(--well) 60%);
    box-shadow:
      inset 0 calc(1*var(--u)) calc(2.2*var(--u)) rgba(0,0,0,.6),
      0 calc(.3*var(--u)) 0 rgba(255,255,255,.1);
  }
  .thumb{
    position:absolute;left:50%;top:50%;
    width:var(--thumb);height:var(--thumb);
    margin:calc(var(--thumb)/-2) 0 0 calc(var(--thumb)/-2);
    border-radius:50%;
    background:radial-gradient(circle at 38% 30%,#93A1B7,#5D6C83 55%,#434F63);
    box-shadow:
      0 calc(1*var(--u)) calc(1.6*var(--u)) rgba(0,0,0,.5),
      inset 0 calc(.3*var(--u)) 0 rgba(255,255,255,.35);
    /* retour au centre en douceur au relâchement */
    transition:transform .16s cubic-bezier(.2,.9,.3,1.25);
    pointer-events:none;
  }
  .thumb::after{
    content:"";position:absolute;inset:24%;border-radius:50%;
    background:radial-gradient(circle at 50% 40%,#3A4659,#505E74);
    box-shadow:inset 0 calc(.5*var(--u)) calc(.9*var(--u)) rgba(0,0,0,.5);
  }
  .thumb.dragging{transition:none;filter:brightness(1.12)}

  /* ---------- Croix directionnelle (8 directions, on peut glisser le doigt d'une direction à l'autre) ---------- */
  .dpad{
    position:relative;
    width:var(--stick);height:var(--stick);
    border-radius:50%;
    touch-action:none;
    background:radial-gradient(circle,#232B36 0 56%,#303A48 57% 59%,var(--well) 60%);
    box-shadow:
      inset 0 calc(1*var(--u)) calc(2.2*var(--u)) rgba(0,0,0,.6),
      0 calc(.3*var(--u)) 0 rgba(255,255,255,.1);
  }
  .dpad .arm{
    position:absolute;pointer-events:none;
    background:linear-gradient(180deg,var(--key-hi),var(--key-lo));
    box-shadow:
      0 calc(.7*var(--u)) 0 rgba(0,0,0,.38),
      inset 0 calc(.3*var(--u)) 0 rgba(255,255,255,.22);
    transition:filter .12s ease-out,box-shadow .12s ease-out;
  }
  .dpad .arm::after{
    content:"";position:absolute;
    width:calc(6*var(--u));height:calc(5*var(--u));
    background:rgba(232,238,247,.6);
    clip-path:polygon(50% 0,100% 100%,0 100%);
  }
  .dpad .arm.up{left:50%;top:calc(4*var(--u));width:calc(15*var(--u));height:calc(23*var(--u));margin-left:calc(-7.5*var(--u));border-radius:calc(3*var(--u)) calc(3*var(--u)) calc(1*var(--u)) calc(1*var(--u))}
  .dpad .arm.down{left:50%;bottom:calc(4*var(--u));width:calc(15*var(--u));height:calc(23*var(--u));margin-left:calc(-7.5*var(--u));border-radius:calc(1*var(--u)) calc(1*var(--u)) calc(3*var(--u)) calc(3*var(--u))}
  .dpad .arm.left{top:50%;left:calc(4*var(--u));height:calc(15*var(--u));width:calc(23*var(--u));margin-top:calc(-7.5*var(--u));border-radius:calc(3*var(--u)) calc(1*var(--u)) calc(1*var(--u)) calc(3*var(--u))}
  .dpad .arm.right{top:50%;right:calc(4*var(--u));height:calc(15*var(--u));width:calc(23*var(--u));margin-top:calc(-7.5*var(--u));border-radius:calc(1*var(--u)) calc(3*var(--u)) calc(3*var(--u)) calc(1*var(--u))}
  .dpad .arm.up::after{left:50%;top:calc(3*var(--u));transform:translateX(-50%)}
  .dpad .arm.down::after{left:50%;bottom:calc(3*var(--u));transform:translateX(-50%) rotate(180deg)}
  .dpad .arm.left::after{top:50%;left:calc(3*var(--u));transform:translateY(-50%) rotate(-90deg)}
  .dpad .arm.right::after{top:50%;right:calc(3*var(--u));transform:translateY(-50%) rotate(90deg)}
  .dpad .arm.on{
    filter:brightness(1.3);
    box-shadow:
      0 0 0 rgba(0,0,0,.38),
      inset 0 calc(.5*var(--u)) calc(1*var(--u)) rgba(0,0,0,.3),
      0 0 calc(3*var(--u)) rgba(143,211,255,.75);
  }
  .dpad::after{
    content:"";position:absolute;left:50%;top:50%;
    width:calc(7*var(--u));height:calc(7*var(--u));margin:calc(-3.5*var(--u)) 0 0 calc(-3.5*var(--u));
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 50% 40%,#3A4659,#505E74);
    box-shadow:inset 0 calc(.5*var(--u)) calc(.9*var(--u)) rgba(0,0,0,.5);
  }

  /* Bouton de bascule Croix / Stick (coin bas-gauche de la zone) */
  .modebtn{
    position:absolute;left:0;bottom:0;z-index:2;
    height:calc(6*var(--u));padding:0 calc(2.4*var(--u));
    border-radius:calc(3*var(--u));
    font-size:max(10px,calc(2.6*var(--u)));
    white-space:nowrap;
  }

  /* ---------- Boutons A B X Y ---------- */
  .face-area{grid-column:3;grid-row:2;display:grid;place-items:center}
  .faces{
    display:grid;
    grid-template:repeat(3,var(--face)) / repeat(3,var(--face));
    gap:calc(1.2*var(--u));
    padding:calc(3*var(--u));
    border-radius:50%;
    background:radial-gradient(circle,#28313D 0 60%,#232B36 61%);
    box-shadow:
      inset 0 calc(.8*var(--u)) calc(1.8*var(--u)) rgba(0,0,0,.45),
      0 calc(.3*var(--u)) 0 rgba(255,255,255,.08);
  }
  .face{
    width:var(--face);height:var(--face);
    border-radius:50%;
    font-size:calc(6.4*var(--u));font-weight:800;
    color:rgba(20,32,43,.82);text-shadow:none;
    background:
      radial-gradient(circle at 35% 28%,rgba(255,255,255,.42),rgba(255,255,255,0) 48%),
      var(--c);
    box-shadow:
      0 calc(.8*var(--u)) 0 rgba(0,0,0,.4),
      inset 0 calc(-.9*var(--u)) calc(1.2*var(--u)) rgba(0,0,0,.22);
  }
  .face.is-down{
    box-shadow:
      0 0 0 rgba(0,0,0,.4),
      inset 0 calc(.5*var(--u)) calc(1*var(--u)) rgba(0,0,0,.3),
      0 0 calc(3.2*var(--u)) var(--glow);
  }
  .face[data-btn=Y]{grid-area:1/2;--c:#EDBE45;--glow:rgba(237,190,69,.85)}
  .face[data-btn=X]{grid-area:2/1;--c:#4B86E8;--glow:rgba(75,134,232,.85)}
  .face[data-btn=B]{grid-area:2/3;--c:#E0594F;--glow:rgba(224,89,79,.85)}
  .face[data-btn=A]{grid-area:3/2;--c:#4FB286;--glow:rgba(79,178,134,.85)}

  /* ---------- Colonne centrale ---------- */
  .center{
    grid-column:2;grid-row:1 / 3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:calc(2.6*var(--u));
    min-width:0;
  }
  .brand-row{display:flex;align-items:center;gap:calc(2.4*var(--u))}
  .brand h1{font-size:calc(5.2*var(--u));font-weight:800;letter-spacing:.1em;line-height:1}
  .brand p{margin-top:calc(.9*var(--u));font-size:max(10px,calc(2.7*var(--u)));color:var(--ink-dim)}
  .icon{
    flex:none;
    width:calc(7*var(--u));height:calc(7*var(--u));border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(180deg,var(--key-hi),var(--key-lo));
    box-shadow:0 calc(.5*var(--u)) 0 rgba(0,0,0,.38),inset 0 calc(.3*var(--u)) 0 rgba(255,255,255,.22);
  }
  .icon svg{width:55%;height:55%;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .lcd{
    width:100%;height:calc(48*var(--u));
    padding:calc(2.2*var(--u)) calc(2.6*var(--u));
    border-radius:calc(2.4*var(--u));
    display:flex;flex-direction:column;gap:calc(.3*var(--u));
    overflow:hidden;
    color:var(--lcd-ink);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    font-size:max(10px,calc(3.1*var(--u)));line-height:1.45;
    background:
      repeating-linear-gradient(0deg,rgba(35,50,33,.07) 0 1px,transparent 1px 3px),
      linear-gradient(180deg,#C3CFB0,#B3C09F);
    box-shadow:
      inset 0 calc(.6*var(--u)) calc(1.4*var(--u)) rgba(0,0,0,.35),
      0 calc(.3*var(--u)) 0 rgba(255,255,255,.12);
  }
  .lcd .row{display:flex;justify-content:space-between;gap:calc(1.4*var(--u));min-width:0}
  .lcd .k{opacity:.7;flex:none}
  .lcd .v{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .log{
    list-style:none;margin-top:calc(.8*var(--u));padding-top:calc(.8*var(--u));
    border-top:1px dashed rgba(35,50,33,.5);
    display:flex;flex-direction:column;gap:0;
  }
  .log li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.6}
  .log li:first-child{opacity:1;font-weight:700}
  .log li::before{content:"› "}

  .meta{display:flex;gap:calc(3*var(--u))}
  .meta .key{
    width:calc(17*var(--u));height:calc(7*var(--u));
    border-radius:calc(3.5*var(--u));
    font-size:max(10px,calc(3*var(--u)));
  }

  /* ---------- Message en mode portrait ---------- */
  .rotate{
    display:none;position:fixed;inset:0;
    place-content:center;justify-items:center;gap:16px;
    padding:24px;text-align:center;font-size:18px;line-height:1.4;
    color:var(--ink);
  }
  .rotate svg{width:64px;height:64px;stroke:var(--ink-dim);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  @media (orientation:portrait){
    .pad{display:none}
    .rotate{display:grid}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>

<body>

<main class="pad" id="pad">

  <!-- Gâchettes gauche -->
  <div class="shoulders left">
    <button class="key shoulder trigger" data-btn="L2" type="button" aria-label="L2">L2</button>
    <button class="key shoulder" data-btn="L1" type="button" aria-label="L1">L1</button>
  </div>

  <!-- Centre : nom, écran de contrôle, Select / Start -->
  <section class="center">
    <div class="brand-row">
      <div class="brand">
        <h1>PHONEPAD</h1>
        <p>Mode test, liaison locale au PC</p>
      </div>
      <button class="icon" id="fs" type="button" aria-label="Plein écran" title="Plein écran" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <div class="lcd" aria-label="Commandes détectées">
      <div class="row"><span class="k">Boutons</span><span class="v" id="o-btn">aucun</span></div>
      <div class="row"><span class="k">Stick</span><span class="v" id="o-axes">x +0.00 y +0.00</span></div>
      <div class="row"><span class="k">Direction</span><span class="v" id="o-dir">centre</span></div>
      <div class="row"><span class="k">État</span><span class="v" id="o-state">relâché</span></div>
      <div class="row"><span class="k">Xbox PC</span><span class="v" id="o-pc">–</span></div>
      <ol class="log" id="o-log"></ol>
    </div>

    <div class="meta">
      <button class="key" data-btn="Select" type="button">Select</button>
      <button class="key" data-btn="Start" type="button">Start</button>
    </div>
  </section>

  <!-- Gâchettes droite -->
  <div class="shoulders right">
    <button class="key shoulder" data-btn="R1" type="button" aria-label="R1">R1</button>
    <button class="key shoulder trigger" data-btn="R2" type="button" aria-label="R2">R2</button>
  </div>

  <!-- Croix directionnelle (par défaut) ou joystick analogique gauche -->
  <div class="stick-area">
    <div class="dpad" id="dpad" role="group" aria-label="Croix directionnelle">
      <i class="arm up" data-dir="Up"></i>
      <i class="arm down" data-dir="Down"></i>
      <i class="arm left" data-dir="Left"></i>
      <i class="arm right" data-dir="Right"></i>
    </div>
    <div class="stick" id="stick" role="group" aria-label="Joystick gauche" hidden>
      <div class="thumb" id="thumb"></div>
    </div>
    <button class="key modebtn" id="mode" type="button" title="Changer entre croix directionnelle et joystick analogique"></button>
  </div>

  <!-- Boutons A B X Y -->
  <div class="face-area">
    <div class="faces">
      <button class="key face" data-btn="Y" type="button" aria-label="Y">Y</button>
      <button class="key face" data-btn="X" type="button" aria-label="X">X</button>
      <button class="key face" data-btn="B" type="button" aria-label="B">B</button>
      <button class="key face" data-btn="A" type="button" aria-label="A">A</button>
    </div>
  </div>

</main>

<div class="rotate" role="status">
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M3 12a9 9 0 0 1 3-6.7M21 12a9 9 0 0 1-3 6.7"/></svg>
  <p>Tournez votre téléphone en mode paysage pour utiliser la manette.</p>
</div>

<script>
(() => {
  "use strict";

  const $ = (sel) => document.querySelector(sel);

  /* État courant de la manette */
  const state = {
    buttons: new Set(),     // boutons actuellement enfoncés
    axes: { x: 0, y: 0 }    // joystick : -1 à +1 (y négatif = vers le haut, comme l'API Gamepad)
  };

  /* ---------- Écran de contrôle ---------- */
  const out = {
    btn: $("#o-btn"), axes: $("#o-axes"), dir: $("#o-dir"),
    st: $("#o-state"), pc: $("#o-pc"), log: $("#o-log")
  };
  const logLines = ["En attente d’une commande"];

  /* ---------- Réglages du joystick ---------- */
  const DEADZONE = 0.08;     // zone morte centrale (0 à 0.3). Au-delà, la valeur repart de 0 : pas de saut.
  const RESEND_MS = 100;     // renvoi périodique de l'état tant qu'une commande est active (rattrape un paquet perdu)
  const TIMEOUT_MS = 1500;   // une requête qui ne répond pas est abandonnée puis remplacée par l'état le plus récent
  let queued = false;

  const fmt = (v) => (v < 0 ? "-" : "+") + Math.abs(v).toFixed(2);
  const DIRS = ["droite", "haut-droite", "haut", "haut-gauche", "gauche", "bas-gauche", "bas", "bas-droite"];

  function direction(a) {
    if (Math.hypot(a.x, a.y) < 0.35) return "centre";
    const deg = Math.atan2(-a.y, a.x) * 180 / Math.PI;
    return DIRS[(Math.round(deg / 45) + 8) % 8];
  }

  const LABEL = { Up: "Haut", Down: "Bas", Left: "Gauche", Right: "Droite" };

  function dirText(set) {
    const v = set.has("Up") ? "haut" : set.has("Down") ? "bas" : "";
    const h = set.has("Left") ? "gauche" : set.has("Right") ? "droite" : "";
    return v && h ? v + "-" + h : v || h || "centre";
  }

  function render() {
    out.btn.textContent = state.buttons.size ? [...state.buttons].map((n) => LABEL[n] || n).join(" + ") : "aucun";
    out.axes.textContent = "x " + fmt(state.axes.x) + " y " + fmt(state.axes.y);
    if (mode === "dpad") {
      out.dir.textContent = dirText(state.buttons);
      out.st.textContent = dpadId !== null ? "croix active" : "relâché";
    } else {
      out.dir.textContent = direction(state.axes);
      out.st.textContent = stickId !== null
        ? "actif · force " + Math.hypot(state.axes.x, state.axes.y).toFixed(2)
        : "relâché";
    }
    out.pc.textContent = net.ack
      ? "x " + fmt(net.ack.x) + " y " + fmt(net.ack.y)
      : (net.err ? "pas de réponse" : "–");
    out.log.replaceChildren(...logLines.map((t) => {
      const li = document.createElement("li");
      li.textContent = t;
      return li;
    }));
  }

  function queueRender() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; render(); });
  }

  function pushLog(text) {
    logLines.unshift(text);
    if (logLines.length > 3) logLines.pop();
  }

  function buzz() {
    try { if (navigator.vibrate) navigator.vibrate(8); } catch (_) {}
  }

  /* Point de sortie unique de toutes les commandes détectées */
  function emit(kind, name, value) {
    const detail = {
      kind,
      name,
      value,
      buttons: [...state.buttons],
      axes: { x: state.axes.x, y: state.axes.y }
    };

    window.dispatchEvent(new CustomEvent("phonepad:input", { detail }));

    dirty = true;
    pump(detail);
    queueRender();
  }

  /* ---------- Envoi au PC : une seule requête à la fois, toujours l'état le plus récent ----------
     Avant, chaque mouvement du doigt lançait sa propre requête. Ces requêtes arrivaient en parallèle
     et pouvaient être traitées dans le désordre : une ancienne position pouvait écraser la plus récente,
     y compris le retour à zéro du relâchement (stick « bloqué »). Ici, une seule requête est en vol ;
     à sa réponse, on renvoie l'état courant s'il a changé. Le protocole (buttons + axes) est inchangé. */
  const net = { ack: null, ms: 0, err: false };
  let inflight = false, dirty = false, lastDetail = null;

  function pump(detail) {
    if (detail) lastDetail = detail;
    if (inflight || !dirty || !lastDetail) return;
    dirty = false;
    inflight = true;
    // On envoie toujours l'état actuel, pas celui de l'événement qui a déclenché l'envoi.
    const snap = {
      kind: lastDetail.kind, name: lastDetail.name, value: lastDetail.value,
      buttons: [...state.buttons],
      axes: { x: state.axes.x, y: state.axes.y }
    };
    const t0 = performance.now();
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);
    fetch("/input", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(snap),
      signal: ctl.signal,
      cache: "no-store"
    }).then((r) => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
      .then((j) => {
        net.err = false;
        net.ms = Math.round(performance.now() - t0);
        net.ack = j && j.applied ? j.applied : null;   // valeurs réellement appliquées par le PC (si le serveur les renvoie)
      })
      .catch(() => {
        net.err = true;
        dirty = true;                                  // l'envoi a échoué : on renverra l'état courant
      })
      .finally(() => {
        clearTimeout(timer);
        inflight = false;
        queueRender();
        if (dirty) pump();
      });
  }

  /* Renvoi périodique : tant qu'un bouton ou le stick est actif, l'état est répété.
     Un paquet perdu ne laisse donc jamais le personnage bloqué dans une direction. */
  setInterval(() => {
    const active = state.buttons.size > 0 || stickId !== null || state.axes.x !== 0 || state.axes.y !== 0;
    if (active && !inflight) { dirty = true; pump(lastDetail || { kind: "tick", name: "", value: null }); }
  }, RESEND_MS);

  /* ---------- Boutons ---------- */
  document.querySelectorAll("[data-btn]").forEach((el) => {
    const name = el.dataset.btn;
    let holder = null;   // pointeur (ou "key") qui tient actuellement le bouton

    function press(id) {
      if (holder !== null) return;
      holder = id;
      el.classList.add("is-down");
      state.buttons.add(name);
      buzz();
      pushLog(name + " pressé");
      emit("button", name, true);
    }

    function release(id) {
      if (holder === null || holder !== id) return;
      holder = null;
      el.classList.remove("is-down");
      state.buttons.delete(name);
      pushLog(name + " relâché");
      emit("button", name, false);
    }

    el.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      press(e.pointerId);
    });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach((type) => {
      el.addEventListener(type, (e) => release(e.pointerId));
    });

    /* Accessibilité clavier (Espace / Entrée) */
    el.addEventListener("keydown", (e) => {
      if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); press("key"); }
    });
    el.addEventListener("keyup", (e) => {
      if (e.key === " " || e.key === "Enter") release("key");
    });
    el.addEventListener("blur", () => release("key"));
  });

  /* ---------- Joystick ---------- */
  const stick = $("#stick");
  const thumb = $("#thumb");
  let stickId = null, cx = 0, cy = 0, travel = 1;

  /* Centre et rayon utile du stick, en pixels écran (recalculés à chaque prise et au redimensionnement) */
  function measure() {
    const r = stick.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top + r.height / 2;
    travel = Math.max(1, (r.width - thumb.offsetWidth) / 2);
  }
  window.addEventListener("resize", measure);
  window.addEventListener("orientationchange", () => setTimeout(measure, 250));

  /* Valeurs envoyées : y négatif = haut (convention de l'écran, inchangée).
     La conversion vers XInput (y positif = haut) se fait une seule fois, côté server.py. */
  function moveTo(e) {
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > travel) { dx *= travel / d; dy *= travel / d; }   // limite circulaire : toutes les directions
    thumb.style.transform = "translate(" + dx + "px," + dy + "px)";

    let x = dx / travel, y = dy / travel;
    const m = Math.hypot(x, y);                                // 0 à 1 (jamais plus, grâce au cercle)
    if (m < DEADZONE) {
      x = 0; y = 0;
    } else {
      // Zone morte progressive : la valeur repart de 0 au bord de la zone morte, sans saut brutal.
      const k = (m - DEADZONE) / (1 - DEADZONE) / m;
      x *= k; y *= k;
    }
    // Arrondi au centième vers zéro : la force ne peut jamais dépasser 1, même en diagonale.
    const nx = Math.trunc(x * 100 + Math.sign(x) * 1e-9) / 100 + 0;   // « + 0 » évite -0
    const ny = Math.trunc(y * 100 + Math.sign(y) * 1e-9) / 100 + 0;
    if (nx === state.axes.x && ny === state.axes.y) return;    // rien de changé : pas de nouvel envoi
    state.axes.x = nx;
    state.axes.y = ny;
    emit("stick", "left", { x: nx, y: ny });
  }

  function endStick(e) {
    if (stickId === null || e.pointerId !== stickId) return;
    stickId = null;
    thumb.classList.remove("dragging");
    thumb.style.transform = "";                                // retour au centre
    state.axes.x = 0;
    state.axes.y = 0;
    pushLog("Stick relâché");
    emit("stick", "left", { x: 0, y: 0 });
  }

  stick.addEventListener("pointerdown", (e) => {
    if (stickId !== null) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    stickId = e.pointerId;
    try { stick.setPointerCapture(e.pointerId); } catch (_) {}
    measure();
    thumb.classList.add("dragging");
    buzz();
    pushLog("Stick saisi");
    queueRender();
    moveTo(e);
  });
  stick.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) moveTo(e); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((type) => stick.addEventListener(type, endStick));

  /* ---------- Croix directionnelle ----------
     Le doigt se pose n'importe où sur la croix puis peut glisser : l'angle par rapport au centre donne
     la direction (8 directions, les diagonales appuient deux flèches à la fois). Chaque flèche est un
     bouton « Up / Down / Left / Right » envoyé au serveur, qui les relie à la croix de la manette Xbox. */
  const DPAD_DEAD = 0.18;    // zone neutre au centre, en fraction du rayon (0 à 0.4)
  const DPAD_THRESH = 0.38;  // seuil d'appui d'une flèche : ~22° autour de chaque axe, donc diagonales larges
  const dpad = $("#dpad");
  const arms = {};
  dpad.querySelectorAll("[data-dir]").forEach((el) => { arms[el.dataset.dir] = el; });
  const DPAD_NAMES = ["Up", "Down", "Left", "Right"];
  let dpadId = null, dcx = 0, dcy = 0, dR = 1;

  function dpadMeasure() {
    const r = dpad.getBoundingClientRect();
    dcx = r.left + r.width / 2;
    dcy = r.top + r.height / 2;
    dR = Math.max(1, r.width / 2);
  }
  window.addEventListener("resize", dpadMeasure);
  window.addEventListener("orientationchange", () => setTimeout(dpadMeasure, 250));

  /* Applique un nouvel ensemble de directions (Set de noms) ; n'émet que s'il a changé */
  function dpadSet(next) {
    let changed = false;
    for (const name of DPAD_NAMES) {
      const was = state.buttons.has(name), now = next.has(name);
      if (was === now) continue;
      changed = true;
      if (now) state.buttons.add(name); else state.buttons.delete(name);
      arms[name].classList.toggle("on", now);
    }
    if (!changed) return;
    const txt = dirText(next);
    if (next.size) { buzz(); pushLog("Croix : " + txt); } else { pushLog("Croix relâchée"); }
    emit("dpad", txt, next.size > 0);
  }

  function dpadFrom(e) {
    const dx = e.clientX - dcx, dy = e.clientY - dcy;
    const d = Math.hypot(dx, dy);
    const next = new Set();
    if (d >= DPAD_DEAD * dR) {
      const ux = dx / d, uy = dy / d;          // vecteur unitaire ; y positif = vers le bas de l'écran
      if (uy < -DPAD_THRESH) next.add("Up");
      if (uy > DPAD_THRESH) next.add("Down");
      if (ux < -DPAD_THRESH) next.add("Left");
      if (ux > DPAD_THRESH) next.add("Right");
    }
    dpadSet(next);
  }

  function endDpad(e) {
    if (dpadId === null || e.pointerId !== dpadId) return;
    dpadId = null;
    dpadSet(new Set());
    queueRender();
  }

  dpad.addEventListener("pointerdown", (e) => {
    if (dpadId !== null) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    dpadId = e.pointerId;
    try { dpad.setPointerCapture(e.pointerId); } catch (_) {}
    dpadMeasure();
    dpadFrom(e);
    queueRender();
  });
  dpad.addEventListener("pointermove", (e) => { if (e.pointerId === dpadId) dpadFrom(e); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((type) => dpad.addEventListener(type, endDpad));

  /* ---------- Bascule Croix / Stick ---------- */
  const modeBtn = $("#mode");
  let mode = "dpad";
  try { const m = localStorage.getItem("phonepad-mode"); if (m === "stick" || m === "dpad") mode = m; } catch (_) {}

  /* Relâche tout ce que tient le stick (sans événement tactile) */
  function releaseStickNow() {
    stickId = null;
    thumb.classList.remove("dragging");
    thumb.style.transform = "";
    if (state.axes.x !== 0 || state.axes.y !== 0) {
      state.axes.x = 0; state.axes.y = 0;
      emit("stick", "left", { x: 0, y: 0 });
    }
  }

  function applyMode(next) {
    if (next !== mode) {
      // On relâche d'abord le contrôle qu'on quitte pour ne jamais laisser une direction coincée.
      if (mode === "stick") releaseStickNow();
      else { dpadId = null; dpadSet(new Set()); }
      mode = next;
      try { localStorage.setItem("phonepad-mode", mode); } catch (_) {}
      pushLog(mode === "dpad" ? "Mode : croix" : "Mode : stick");
    }
    dpad.hidden = mode !== "dpad";
    stick.hidden = mode !== "stick";
    modeBtn.textContent = mode === "dpad" ? "→ Stick" : "→ Croix";
    modeBtn.setAttribute("aria-label", mode === "dpad" ? "Passer au joystick analogique" : "Passer à la croix directionnelle");
    queueRender();
  }
  modeBtn.addEventListener("click", () => applyMode(mode === "dpad" ? "stick" : "dpad"));
  applyMode(mode);

  /* ---------- Plein écran (utile sur Android) ---------- */
  const fs = $("#fs");
  if (document.documentElement.requestFullscreen) {
    fs.hidden = false;
    fs.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
          try { await screen.orientation.lock("landscape"); } catch (_) {}
        }
      } catch (_) {}
    });
  }

  /* ---------- Confort tactile ---------- */
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  /* Empêche le navigateur de détourner un glissement en défilement / actualisation de page */
  document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

  render();

  /* ---------- Étape suivante ----------
     Chaque commande passe par l'événement "phonepad:input".
     C'est ici que viendra plus tard l'envoi vers le PC. Pour l'instant : console seulement.

     window.addEventListener("phonepad:input", (e) => console.log(e.detail));
  */
  window.PHONEPAD = { getState: () => ({ buttons: [...state.buttons], axes: { ...state.axes } }) };
})();
</script>
</body>
</html>
